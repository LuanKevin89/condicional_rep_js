
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Desconto</title>
</head>
<body>

    <h1>Calculadora de Desconto</h1>

    <label for="compra">Valor da compra:</label>
    <input type="number" id="compra" placeholder="Digite o valor">

    <button onclick="calcularDesconto()">Calcular desconto</button>

    <h2>Resultado</h2>

    <p>Valor da compra: <span id="valorCompra">R$ 0,00</span></p>

    <p>Valor do desconto: <span id="valorDesconto">R$ 0,00</span></p>

    <p>Valor da compra com desconto: <span id="valorFinal">R$ 0,00</span></p>

    <script src="main.js"></script>

</body>
</html>
